<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50" width="100%" height="100%">
  <defs>
    <!-- Primary Car Body Gradient -->
    <linearGradient id="bodyGrad_tempest.svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Cockpit Glass Gradient -->
    <linearGradient id="glassGrad_tempest.svg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Headlight Glow Filter -->
    <filter id="glow_tempest.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="62" cy="44" rx="52" ry="4" fill="#000000" opacity="0.45" />

  <!-- Rear Exhaust Pipe -->
  <rect x="4" y="34" width="7" height="3" rx="1" fill="#475569" stroke="#1E293B" stroke-width="0.8" />
  <circle cx="4" cy="35.5" r="1.5" fill="#F97316" filter="url(#glow_tempest.svg)" />

  
      <!-- Drift Wing -->
      <path d="M 14 25 L 5 14 L 28 14 L 30 25 Z" fill="#60A5FA" stroke="#000000" stroke-width="1.2" />
    

  <!-- Main Body Chassis -->
  <path d="M 6 38 L 10 26 L 32 18 L 68 18 L 94 23 L 116 27 L 118 38 Z" fill="url(#bodyGrad_tempest.svg)" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Side Trim Line / Stripe -->
  <path d="M 10 32 L 114 32" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Cockpit / Windshield Canopy -->
  <path d="M 36 24 L 48 19 L 68 19 L 82 24 Z" fill="url(#glassGrad_tempest.svg)" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Glass Specular Highlight -->
  <path d="M 40 22 L 48 19 L 62 19" stroke="#E0F2FE" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Front Headlight Assembly -->
  <path d="M 113 28 L 118 29 L 118 34 L 113 34 Z" fill="#FEF08A" stroke="#000000" stroke-width="0.8" filter="url(#glow_tempest.svg)" />
  <!-- Headlight Light Beam -->
  <polygon points="118,29 120,26 120,37 118,34" fill="#FEF08A" opacity="0.6" />

  <!-- Rear Taillight Assembly -->
  <path d="M 7 28 L 10 28 L 10 34 L 7 34 Z" fill="#EF4444" stroke="#000000" stroke-width="0.8" filter="url(#glow_tempest.svg)" />

  <!-- Rear Wheel Assembly (cx=30, cy=38) -->
  <g class="wheel-rear">
    <circle cx="30" cy="38" r="9" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="38" r="6" fill="#475569" />
    <circle cx="30" cy="38" r="3" fill="#94A3B8" />
    <!-- Retro Arcade Spoke Detail -->
    <line x1="30" y1="31" x2="30" y2="45" stroke="#CBD5E1" stroke-width="1" />
    <line x1="23" y1="38" x2="37" y2="38" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <!-- Front Wheel Assembly (cx=95, cy=38) -->
  <g class="wheel-front">
    <circle cx="95" cy="38" r="9" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="95" cy="38" r="6" fill="#475569" />
    <circle cx="95" cy="38" r="3" fill="#94A3B8" />
    <!-- Retro Arcade Spoke Detail -->
    <line x1="95" y1="31" x2="95" y2="45" stroke="#CBD5E1" stroke-width="1" />
    <line x1="88" y1="38" x2="102" y2="38" stroke="#CBD5E1" stroke-width="1" />
  </g>
</svg>
